<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The K.I.S.S model for mastering AI</title>
<style>
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/instrument-sans-latin-400-normal.woff2") format("woff2");}
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/instrument-sans-latin-500-normal.woff2") format("woff2");}
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/instrument-sans-latin-600-normal.woff2") format("woff2");}
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/bricolage-grotesque-latin-500-normal.woff2") format("woff2");}
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/bricolage-grotesque-latin-700-normal.woff2") format("woff2");}
@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/jetbrains-mono-greek-400-normal.woff2") format("woff2");unicode-range:U+0370-03FF;}
@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/jetbrains-mono-greek-500-normal.woff2") format("woff2");unicode-range:U+0370-03FF;}
@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2");}
@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2");}
html,body{margin:0}body{font-size:14px;-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]{display:none!important}
/* Layout: a header band, then a two-pane workspace: the left-to-right level map (or curriculum list) and a study panel. */
:root{
  --r-i:#2563EB; --r-k:#7C3AED; --r-s:#059669; --r-x:#C2410C; --on-r:#FFFFFF;
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E9EDF4; --fg:#172033; --muted:#566278;
  --line:#D3DAE6; --edge:#A9B4C6; --accent:#2F5FD0; --on-c:#FFFFFF; --stripe:#E8ECF3;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --d-math:#2F5FD0; --d-prob:#7A4BD6; --d-opt:#BE2C84; --d-sys:#5D6B80; --d-ml:#2C8540;
  --d-dl:#D2620C; --d-nlp:#08848F; --d-cv:#C53434; --d-gen:#A57E06; --d-rl:#7D5636;
  --d-llm:#DD3F74; --d-agent:#4F7A0E; --d-safe:#3B47A6; --d-app:#86198F;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --r-i:#7EA6FF; --r-k:#B794FF; --r-s:#4ADE9B; --r-x:#FBAF5D; --on-r:#0E1320;
  --bg:#0E1320; --surface:#161E30; --surface-2:#1D2740; --fg:#E5E9F2; --muted:#98A3B8;
  --line:#2B3754; --edge:#3D4A68; --accent:#86A7FF; --on-c:#0E1320; --stripe:#131A2B;
  --d-math:#86A7FF; --d-prob:#B596FF; --d-opt:#F27DC2; --d-sys:#A3B0C4; --d-ml:#6CCB7E;
  --d-dl:#FF9F55; --d-nlp:#4FD0DA; --d-cv:#FF7F7F; --d-gen:#E6C04D; --d-rl:#CFA27C;
  --d-llm:#FF85AE; --d-agent:#A7D45A; --d-safe:#9AA6FF; --d-app:#E879F9; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --r-i:#7EA6FF; --r-k:#B794FF; --r-s:#4ADE9B; --r-x:#FBAF5D; --on-r:#0E1320;
  --bg:#0E1320; --surface:#161E30; --surface-2:#1D2740; --fg:#E5E9F2; --muted:#98A3B8;
  --line:#2B3754; --edge:#3D4A68; --accent:#86A7FF; --on-c:#0E1320; --stripe:#131A2B;
  --d-math:#86A7FF; --d-prob:#B596FF; --d-opt:#F27DC2; --d-sys:#A3B0C4; --d-ml:#6CCB7E;
  --d-dl:#FF9F55; --d-nlp:#4FD0DA; --d-cv:#FF7F7F; --d-gen:#E6C04D; --d-rl:#CFA27C;
  --d-llm:#FF85AE; --d-agent:#A7D45A; --d-safe:#9AA6FF; --d-app:#E879F9; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
header{padding-block:14px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:10px}
.toprow{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.brand{flex:1 1 320px;min-width:0}
h1{font-family:var(--font-display);font-weight:700;font-size:1.45rem;letter-spacing:-.01em;margin:0;line-height:1.15;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:.9rem}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{position:relative}
.search input{width:min(280px,78vw);padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
.search ul{position:absolute;z-index:20;top:calc(100% + 4px);left:0;right:0;min-width:260px;margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(10,20,40,.16);max-height:320px;overflow:auto}
.search li button{display:flex;width:100%;gap:8px;align-items:center;padding:6px 8px;border:0;background:none;border-radius:6px;text-align:left;cursor:pointer}
.search li button:hover,.search li button.kb{background:var(--surface-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.legend{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:.78rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 390px}
.pane{position:relative;min-width:0;min-height:0;overflow:hidden}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--bg)}
#map:active{cursor:grabbing}
.zoombtns[hidden],.hint[hidden]{display:none}
.zoombtns{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoombtns button{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:600}
.hint{position:absolute;left:12px;bottom:12px;font-size:.75rem;color:var(--muted);background:color-mix(in srgb,var(--surface) 85%,transparent);padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
/* SVG */
.colband{fill:var(--stripe)}
.colband.appband{fill:color-mix(in srgb,var(--d-app) 10%,var(--bg))}
.colname.appname{fill:var(--d-app)}
.colnum{font-family:var(--font-mono);font-size:11px;fill:var(--muted);letter-spacing:.08em}
.colname{font-family:var(--font-display);font-weight:700;font-size:17px;fill:var(--fg)}
.edge{fill:none;stroke:var(--edge);stroke-width:1;opacity:.55;transition:opacity .2s}
.edge.on{stroke:var(--c);opacity:.85;stroke-width:1.5}
.edge.hov{stroke:var(--fg);opacity:.95;stroke-width:1.8}
.edge.dim{opacity:.05}
.node{cursor:pointer;transition:opacity .2s}
.node rect.hit{fill:transparent!important;stroke:none!important}
.node rect{fill:var(--surface);stroke:color-mix(in srgb,var(--c) 40%,var(--line));stroke-width:1}
.node circle{fill:var(--c)}
.node text{font-family:var(--font-body);font-size:11.5px;font-weight:500;fill:var(--fg)}
.node text.sl{font-family:var(--font-mono);font-size:8px;font-weight:700;fill:var(--surface);pointer-events:none}
.node.sel text.sl{fill:var(--c)}
.node:hover rect,.node:focus-visible rect{stroke:var(--c);stroke-width:2}
.node:focus{outline:none}
.node.on rect{fill:color-mix(in srgb,var(--c) 18%,var(--surface));stroke:var(--c)}
.node.sel rect{fill:var(--c);stroke:var(--c);stroke-width:2}
.node.sel text.lbl{fill:var(--on-c);font-weight:600}
.node.sel circle{fill:var(--on-c)}
.node.dim{opacity:.16}
/* Curriculum */
#list{height:100%;overflow:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.lvl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 20px;padding-block:16px;border-bottom:1px solid var(--line)}
.lvl h2{font-family:var(--font-display);font-size:1.05rem;margin:0;line-height:1.2}
.lvl .num{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.lvl p{margin:4px 0 0;color:var(--muted);font-size:.82rem}
.items{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.item{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));border-radius:999px;background:var(--surface);cursor:pointer;font-size:.82rem;transition:opacity .2s}
.item.on{background:color-mix(in srgb,var(--c) 18%,var(--surface));border-color:var(--c)}
.item.sel{background:var(--c);color:var(--on-c);border-color:var(--c)}
.item.sel .dot{background:var(--on-c)}
.item.dim{opacity:.3}
/* Panel */
aside{border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding-block:18px 32px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.78rem;color:var(--muted)}
.meta .dchip{display:inline-flex;align-items:center;gap:6px;color:var(--fg);font-weight:500}
.lvtag{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
aside h2{font-family:var(--font-display);font-size:1.5rem;line-height:1.15;margin:8px 0 8px;text-wrap:balance}
aside h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:22px 0 8px;font-weight:600}
.desc{margin:0;font-size:.95rem;max-width:62ch}
.formula{margin-top:12px;font-family:var(--font-mono);font-size:.85rem;background:var(--surface-2);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links .item{font-size:.8rem}
.none{color:var(--muted);font-size:.85rem;margin:0}
.modes{display:flex;gap:6px;margin-top:16px}
.modes button{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:.82rem;font-weight:500}
.modes button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.profile{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:10px}
.profile div{display:flex;flex-direction:column;align-items:center;gap:3px}
.profile .bar{width:100%;height:36px;background:var(--surface-2);border-radius:4px;position:relative;overflow:hidden}
.profile .bar span{position:absolute;left:0;right:0;bottom:0;background:var(--accent);border-radius:4px 4px 0 0}
.profile small{font-family:var(--font-mono);font-size:.66rem;color:var(--muted);font-variant-numeric:tabular-nums}
.path{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.path .lh{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:var(--surface-2);border-radius:8px;padding:10px}
.stats b{display:block;font-family:var(--font-display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.75rem;color:var(--muted)}
.howto{margin:0;padding-left:18px;font-size:.88rem}
.howto li{margin-bottom:4px}
.foot{margin-top:24px;font-size:.75rem;color:var(--muted)}
/* K.I.S.S */
.rk2{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;background:var(--fg);color:var(--bg);font-family:var(--font-mono);font-size:.7rem;font-weight:600;flex:none}
.ladder{display:flex;flex-direction:column;gap:6px;margin-top:20px}
.ladhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px}
.ladhead h3{margin:0}
.ladnote{font-size:.75rem;color:var(--muted)}
.rung{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:start;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.rung:hover{border-color:var(--c)}
.rung .rl{display:flex;gap:8px;align-items:flex-start}
.rung .rl b{display:block;font-size:.88rem}
.rung .rl small{display:block;font-size:.72rem;color:var(--muted)}
.rung .rt2{font-size:.86rem;line-height:1.45}
.rung .rb{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.rung.reached{background:color-mix(in srgb,var(--c) 10%,var(--surface));border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.rung.current{border-color:var(--c);border-width:2px;padding:9px 11px}
.keytag{font-size:.7rem;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid var(--c);color:var(--fg)}
.sform{display:inline-block;margin-right:6px;padding:1px 7px;border-radius:999px;background:var(--surface-2);font-size:.72rem;font-weight:600}
.forms{margin-top:6px;font-size:.84rem}
.forms summary{cursor:pointer;color:var(--fg);font-weight:500;padding:4px 0}
.natline{margin:6px 0 8px;color:var(--muted)}
.forms ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.forms li{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;padding:7px 10px;border-radius:6px;background:var(--surface-2);opacity:.75}
.forms li.fit{opacity:1;background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.goalsel{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit;max-width:min(260px,80vw)}
@media (max-width:700px){.forms li{grid-template-columns:1fr;gap:2px}}
.mysucc{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding:12px 14px;border:2px dashed var(--c);border-radius:10px;background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.mysucc.filled{border-style:solid;background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.mysucc label{display:flex;align-items:center;gap:8px;font-size:.92rem;font-weight:700;color:var(--fg)}

.mssaved{display:none;margin-left:auto;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--c);color:var(--on-c)}
.mysucc.filled .mssaved{display:inline-block}
.mysucc textarea{width:100%;resize:vertical;min-height:56px;padding:9px 11px;border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));border-radius:8px;background:var(--surface);color:var(--fg);font:inherit;font-size:.92rem;line-height:1.45}
.mysucc textarea:focus{outline:2px solid var(--c);outline-offset:0;border-color:var(--c)}
.mshint{font-size:.74rem;color:var(--muted)}
.sform.mine{background:var(--c);color:var(--on-c)}
.ladclear{align-self:flex-start;border:0;background:none;color:var(--muted);font-size:.78rem;text-decoration:underline;cursor:pointer;padding:2px 0}
.r-i{--rc:var(--r-i)}.r-k{--rc:var(--r-k)}.r-s{--rc:var(--r-s)}.r-x{--rc:var(--r-x)}
.rk2.r-i,.rk2.r-k,.rk2.r-s,.rk2.r-x,.stg.r-i,.stg.r-k,.stg.r-s,.stg.r-x{background:var(--rc);color:var(--on-r)}
.kl{color:var(--rc);font-weight:800}
.kiss{letter-spacing:.01em}
.kiss .kl{font-weight:800}
.wseg button.r-i b,.wseg button.r-k b,.wseg button.r-s b,.wseg button.r-x b{color:var(--rc)}
.wseg button[aria-pressed="true"].r-i,.wseg button[aria-pressed="true"].r-k,.wseg button[aria-pressed="true"].r-s,.wseg button[aria-pressed="true"].r-x{background:var(--rc);color:var(--on-r)}
.wseg button[aria-pressed="true"] b{color:var(--on-r)!important}
.stg{font-family:var(--font-mono);font-size:.62rem;font-weight:700;padding:0 5px;border-radius:4px;background:var(--fg);color:var(--bg);margin-left:2px}
.item.sel .stg{background:var(--on-c);color:var(--c)}
.funnel{display:flex;flex-direction:column;gap:8px}
.frow{display:grid;grid-template-columns:118px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:.82rem}
.fl{display:flex;align-items:center;gap:6px}
.ftrack{position:relative;height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.fyou{position:absolute;left:0;bottom:0;height:9px;background:var(--accent);min-width:0;border-radius:0 3px 3px 0}
.fn{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.fn small{color:var(--muted);font-weight:400}
.lkiss{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.lkiss div{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:.78rem}
.lkiss b{margin-left:6px;font-size:.8rem}
.lkiss p{margin:6px 0 0;color:var(--fg);font-size:.78rem;line-height:1.4}
@media (max-width:1100px){.lkiss{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.rung{grid-template-columns:minmax(0,1fr)}.rung .rt2{grid-column:1/-1;grid-row:2}.lkiss{grid-template-columns:1fr}}
#roles{height:100%;overflow:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.rolesintro h2{font-family:var(--font-display);font-size:1.3rem;margin:0}
.rolesintro p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.rfam{margin-top:20px}
.rfam h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 8px;font-weight:600}
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.rcard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.rcard:hover,.rcard.cur{border-color:var(--accent)}
.rcard b{font-family:var(--font-display);font-size:1rem}
.rcard .rd{font-size:.84rem}
.rcard .rm{font-size:.74rem;color:var(--muted)}
.rbar{display:block;height:4px;border-radius:2px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.rbar span{display:block;height:100%;background:var(--accent)}
.succchip{font-size:.8rem;padding:4px 10px;border-radius:999px;background:var(--surface-2);font-weight:500}
.rgroup{margin-bottom:10px}
.rgroup summary{display:flex;justify-content:space-between;cursor:pointer;font-weight:600;font-size:.88rem;padding:6px 0}
.rgroup summary b{font-variant-numeric:tabular-nums;color:var(--muted)}
.rgroup .links{margin-top:4px}
.item .need{font-family:var(--font-mono);font-size:.62rem;color:var(--muted);margin-left:4px}
.node.tgt rect{stroke:var(--c);stroke-width:2.4;fill:color-mix(in srgb,var(--c) 30%,var(--surface))}
.node.tgt text.lbl{font-weight:700}
.bglabel{display:inline-flex;align-items:center;gap:8px;margin-top:12px;font-size:.85rem;font-weight:500}
.bgsel{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit;max-width:100%}
.phases{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}

["numbers","Number Systems","math",0,"","Natural, integer, rational, real and complex numbers, and place-value notation in different bases.",""],

function resourcesFor(n){
  const out = [];
  (RES[n.id]||"").split("|").filter(Boolean).forEach(tok=>{
    if(tok.startsWith("ax:")){ const sp=tok.indexOf(" "); const id=tok.slice(3,sp); out.push({t:tok.slice(sp+1), u:`https://arxiv.org/abs/${id}`, type:"paper", src:`arXiv ${id}`}); }
    else if(LIB[tok]){ const [t,u,type,src]=LIB[tok]; out.push({t,u,type,src}); }
    else console.warn("unknown resource", tok, "for", n.id);
  });
  const q = encodeURIComponent(n.label.replace(/\s*\(.*?\)/g,""));
  const search = [
    {t:"Wikipedia", u:`https://en.wikipedia.org/w/index.php?search=${q}`, src:"Encyclopedia"},
    {t:"YouTube lectures", u:`https://www.youtube.com/results?search_query=${q}+${n.lv<=2?"math+lesson":"machine+learning+lecture"}`, src:"Video search"},
  ];
  if(n.lv>=3) search.push({t:"arXiv papers", u:`https://arxiv.org/search/?query=${q}&searchtype=all`, src:"Paper search"});
  if(n.lv>=3) search.push({t:"Google Scholar", u:`https://scholar.google.com/scholar?q=${q}`, src:"Paper search"});
  return {learn: out.filter(r=>r.type!=="paper"), papers: out.filter(r=>r.type==="paper"), search};
}

function naturalForms(n){
  if(FORM_OVERRIDE[n.id]) return FORM_OVERRIDE[n.id];
  const d=n.d, lv=n.lv, leaf=!n.kids.length;
  if(d==="safe") return ["influence","paper"];
  if(lv<=2) return d==="sys" ? ["sme","influence"] : ["influence","sme"];
  if(d==="sys") return ["sme","adoption"];
  if(d==="agent") return ["adoption","technique"];
  if(lv<=4) return (d==="rl"||d==="gen") ? ["adoption","paper"] : ["adoption","sme"];
  if(lv===5) return ["paper","technique"];
  if(lv===6) return (d==="llm"||d==="cv"||d==="nlp") ? ["adoption","paper"] : ["paper","technique"];

}

function rolePath(role){
  const t = role.targets.split(/\s+/).map(id=>byId.get(id)).filter(Boolean);
  const need = new Map();
  const put = (n,r)=>{ if(!need.has(n) || RUNG_RANK[r]>RUNG_RANK[need.get(n)]) need.set(n,r); };
  t.forEach(n=>put(n, role.depth));
  t.forEach(n=>n.pre.forEach(p=>put(p, role.depth==="s"?"k":"i")));
  t.forEach(n=>closure(n,"pre").forEach(a=>put(a,"i")));
  return need;
}
function roleGap(need){
  let met=0; const gaps=[];
  need.forEach((r,n)=>{ const have=STAGE_IDX[getStage(n.id)]; if(have>=RUNG_RANK[r]) met++; else gaps.push(n); });
  return {met, gaps};
}

function closure(n, key){ const seen=new Set(); const st=[...n[key]]; while(st.length){const x=st.pop(); if(seen.has(x))continue; seen.add(x); st.push(...x[key]);} return seen; }

/* ---------- Layout ---------- */
const COLW = 290, ROWH = 26, PH = 19;
const measure = document.createElement("canvas").getContext("2d");
function layout(){
  measure.font = '500 11.5px "Instrument Sans", system-ui, sans-serif';
  nodes.forEach(n=> n.w = Math.ceil(measure.measureText(n.label).width) + 30);
  nodes.forEach(n=> n.col = n.d==="app" ? LEVELS.length : n.lv);
  const cols = Array.from({length:LEVELS.length+1},(_,i)=>nodes.filter(n=>n.col===i));
  const maxLen = Math.max(...cols.map(c=>c.length));
  const band = n => (dIndex[n.d]/(DOMAINS.length-1) - .5) * maxLen * ROWH * .9;
  const place = c => { const off=(c.length-1)*ROWH/2; c.forEach((n,i)=>n.y=i*ROWH-off); };
  cols.forEach(c=>{ c.sort((a,b)=>dIndex[a.d]-dIndex[b.d]); place(c); });
  const mean = a => a.reduce((s,x)=>s+x.y,0)/a.length;
  for(let it=0; it<10; it++){
    for(let l=1;l<cols.length;l++){ cols[l].forEach(n=>{ const b=n.pre.length?mean(n.pre):n.y; n.t=.62*b+.38*band(n); }); cols[l].sort((a,b)=>a.t-b.t); place(cols[l]); }
    for(let l=cols.length-2;l>=0;l--){ cols[l].forEach(n=>{ const b=n.kids.length?mean(n.kids):n.y; n.t=.55*b+.2*n.y+.25*band(n); }); cols[l].sort((a,b)=>a.t-b.t); place(cols[l]); }
  }
  for(let l=1;l<cols.length;l++){ cols[l].forEach(n=>{ const b=n.pre.length?mean(n.pre):n.y; n.t=.62*b+.38*band(n); }); cols[l].sort((a,b)=>a.t-b.t); place(cols[l]); }
  nodes.forEach(n=> n.x = n.col*COLW);
  return maxLen;
}

  edgeSel = root.append("g").selectAll("path").data(edges).join("path").attr("class","edge")
    .attr("d", e=>{
      const x1=e.s.x+e.s.w, y1=e.s.y, x2=e.t.x, y2=e.t.y;
      if(e.s.col===e.t.col){ const sx=e.s.x, k=Math.min(60,20+Math.abs(y2-y1)*.25); return `M${sx},${y1} C${sx-k},${y1} ${x2-k},${y2} ${x2},${y2}`; }
      const dx=Math.min(110,(x2-x1)/2); return `M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`;
    });
  nodeSel = root.append("g").selectAll("g").data(nodes).join("g").attr("class","node")
    .attr("transform", n=>`translate(${n.x},${n.y-PH/2})`).attr("style", n=>`--c:var(--d-${n.d})`)

    .on("mouseenter",(ev,n)=>{ edgeSel.classed("hov",e=>e.s===n||e.t===n); d3.select(ev.currentTarget).raise(); })
    .on("mouseleave",()=> edgeSel.classed("hov",false));
  nodeSel.append("rect").attr("class","hit").attr("x",-6).attr("y",-(ROWH-PH)/2).attr("width",n=>n.w+12).attr("height",ROWH);
  nodeSel.append("rect").attr("class","pill").attr("width",n=>n.w).attr("height",PH).attr("rx",PH/2);
  nodeSel.append("circle").attr("cx",10).attr("cy",PH/2).attr("r",3.6);
  nodeSel.append("text").attr("class","lbl").attr("x",19).attr("y",PH/2+4).text(n=>n.label);
  nodeSel.append("text").attr("class","sl").attr("x",10).attr("y",PH/2+3).attr("text-anchor","middle");
  zoom = d3.zoom().scaleExtent([.2,2.5]).clickDistance(5).on("zoom", e=>root.attr("transform", e.transform));
  svg.call(zoom).on("dblclick.zoom", null);
  svg.on("click", ()=> { if(state.sel || state.role){ state.role=null; select(null); } });
}
function bounds(){ const xs=nodes.map(n=>n.x), xe=nodes.map(n=>n.x+n.w), ys=nodes.map(n=>n.y); return {x0:Math.min(...xs)-20,x1:Math.max(...xe)+20,y0:Math.min(...ys)-80,y1:Math.max(...ys)+20}; }
function fit(anim=true){ const r=svg.node().getBoundingClientRect(); const b=bounds(); const k=Math.min(r.width/(b.x1-b.x0), r.height/(b.y1-b.y0))*.96;
  const t=d3.zoomIdentity.translate(r.width/2-k*(b.x0+b.x1)/2, r.height/2-k*(b.y0+b.y1)/2).scale(k);

const q = document.getElementById("q"), qres = document.getElementById("qres"); let hits=[], kb=0;
function runSearch(){
  const s = q.value.trim().toLowerCase(); if(!s){ qres.hidden=true; return; }
  hits = nodes.map(n=>{ const l=n.label.toLowerCase(); const sc = l.startsWith(s)?0 : l.includes(s)?1 : n.desc.toLowerCase().includes(s)?2 : 9; return [sc,n]; })
    .filter(([sc])=>sc<9).sort((a,b)=>a[0]-b[0]||a[1].lv-b[1].lv).slice(0,9).map(x=>x[1]);
  kb=0;
  qres.innerHTML = hits.length? hits.map((n,i)=>`<li><button data-id="${n.id}" class="${i===kb?"kb":""}" style="--c:var(--d-${n.d})"><span class="dot"></span><span>${esc(n.label)}</span><small style="margin-left:auto;color:var(--muted)">L${n.lv}</small></button></li>`).join("")
    : `<li style="padding:8px;color:var(--muted)">No topic matches “${esc(q.value)}”.</li>`;
  qres.hidden=false;
}
q.addEventListener("input", runSearch);
q.addEventListener("keydown", ev=>{
  if(qres.hidden||!hits.length) return;
  if(ev.key==="ArrowDown"||ev.key==="ArrowUp"){ ev.preventDefault(); kb=(kb+(ev.key==="ArrowDown"?1:-1)+hits.length)%hits.length; qres.querySelectorAll("button").forEach((b,i)=>b.classList.toggle("kb",i===kb)); }

});

const PHONE_K = .9;
function jumpLevel(i, anim=true){
  const r=svg.node().getBoundingClientRect(); const cur=d3.zoomTransform(svg.node());
  const k=Math.max(cur.k, isPhone()?PHONE_K:.6);
  const col=nodes.filter(n=>n.col===i); const cy=(Math.min(...col.map(n=>n.y))+Math.max(...col.map(n=>n.y)))/2;
  const t=d3.zoomIdentity.translate(14 - k*(i*COLW-16), r.height/2 + 20 - k*cy).scale(k);
  (anim?svg.transition().duration(500):svg).call(zoom.transform,t);
}

    const fall=()=>{ ta.focus(); ta.select(); st.textContent="Select-all is on. Copy it with your device's Copy command."; };
    try{ navigator.clipboard.writeText(ta.value).then(done, fall); }catch(e){ fall(); } }
  if(k==="sharebk" && window.AtlasNative){ window.AtlasNative.share("K.I.S.S AI backup", document.getElementById("setBackup").value); }
  if(k==="restore"){ const st=document.getElementById("rsStatus");
    try{ const o=JSON.parse(document.getElementById("setRestore").value); if(!o||o.app!=="kiss-ai"||typeof o.data!=="object") throw 0;
      let c=0; Object.entries(o.data).forEach(([key,val])=>{ if(key.startsWith("atlas-") && typeof val==="string"){ localStorage.setItem(key,val); c++; } });
      rerenderAll(); st.textContent=`Restored ${c} saved items.`; document.getElementById("setBackup").value=backupJSON();
    }catch(e){ st.textContent="That doesn't look like a K.I.S.S AI backup. Paste the whole text you copied."; } }
  return true;
}
function rerenderAll(){ refreshStages(); renderPanel(); if(state.view==="roles") renderRoles(); if(state.view==="home") renderHome(); }

document.getElementById("pSettings").onclick=openSettings;

/* ---------- Android Back button ---------- */
window.atlasBack = function(){
  if(!modal.hidden){ closeModal(); return true; }
  const hd=document.querySelector("header");
  if(hd.classList.contains("searching")){ hd.classList.remove("searching"); qres.hidden=true; return true; }
  if(!qres.hidden){ qres.hidden=true; return true; }
  if(state.view==="roles" && roleDetail){ roleDetail=null; renderRoles(); return true; }
  if(state.view==="graph" && (state.sel||state.role)){ state.role=null; select(null); return true; }
  if(isPhone() && state.view!=="home"){ setView("home"); return true; }
  if(!isPhone() && state.view!=="graph"){ setView("graph"); return true; }
  return false;
};

/* ---------- Roles UI ---------- */
function fitNodes(list, anim=true){
  if(!list.length) return; const r=svg.node().getBoundingClientRect(); if(!r.width) return;
  const x0=Math.min(...list.map(n=>n.x))-30, x1=Math.max(...list.map(n=>n.x+n.w))+30, y0=Math.min(...list.map(n=>n.y))-80, y1=Math.max(...list.map(n=>n.y))+30;
  let k=Math.max(.2, Math.min(1.1, Math.min(r.width/(x1-x0), r.height/(y1-y0))*.95));
  if(isPhone()){ k=Math.max(k,.75); const tg=state.role ? ROLES.find(x=>x.id===state.role).targets.split(/\s+/).map(id=>byId.get(id)) : list;
    const cx=(Math.min(...tg.map(n=>n.x))+Math.max(...tg.map(n=>n.x+n.w)))/2, cy=(Math.min(...tg.map(n=>n.y))+Math.max(...tg.map(n=>n.y)))/2;
    const t=d3.zoomIdentity.translate(r.width/2-k*cx, r.height/2-k*cy).scale(k); (anim?svg.transition().duration(650):svg).call(zoom.transform,t); return; }
  const t=d3.zoomIdentity.translate(r.width/2-k*(x0+x1)/2, r.height/2-k*(y0+y1)/2).scale(k);
  (anim?svg.transition().duration(650):svg).call(zoom.transform,t);
}
function selectRole(id, opts={}){
  state.role=id; state.sel=null; state.dom=null;
  if(id){ try{ localStorage.setItem("atlas-lastrole", id); }catch(e){} }
  if(!modal.hidden) closeModal();
  renderPanel(); applyHighlight();
  if(id && state.view==="graph") fitNodes([...rolePath(ROLES.find(x=>x.id===id)).keys()], opts.anim!==false);
  if(id && location.hash.slice(1)!=="role-"+id){ try{ history.replaceState(null,"","#role-"+id); }catch(e){ location.hash="role-"+id; } }
}
const RUNG_LABEL = {s:"Build it (Skill)", k:"Teach it (Knowledge)", i:"Be aware of it (Information)"};
function roleHTML(role){
  const need=rolePath(role), {met,gaps}=roleGap(need);
  const by = rr => [...need].filter(([n,x])=>x===rr).map(([n])=>n).sort((a,b)=>a.lv-b.lv||dIndex[a.d]-dIndex[b.d]);
  const S=by("s"), K=by("k"), I=by("i");
  const deep = gaps.filter(n=>need.get(n)!=="i"), shallow = gaps.filter(n=>need.get(n)==="i");
  const next = (deep.length?deep:shallow).sort((a,b)=>a.lv-b.lv||b.nDesc-a.nDesc).slice(0,6);
  const pct = Math.round(met/need.size*100);
  const group = (title,list,open)=> list.length ? `<details class="rgroup" ${open?"open":""}><summary><span>${title}</span><b>${list.length}</b></summary><div class="links">${list.map(itemHTML).join("")}</div></details>` : "";
  return `<div class="meta"><span class="lvtag">Role · ${esc(ROLE_FAMILIES[role.fam])}</span></div>
    <h2>${esc(role.name)}</h2>
    <p class="desc">${esc(role.does)}</p>
    <div class="stats"><div><b>${S.length||"–"}</b><span>topics to build</span></div><div><b>${K.length + (role.depth==="k"?0:0)}</b><span>topics to teach</span></div><div><b>${I.length}</b><span>topics to know of</span></div></div>
    <h3>What success looks like</h3>
    <div class="links">${role.success.map(k=>`<span class="succchip">${esc(FORM[k].name)}</span>`).join("")}</div>
    <h3>Your readiness</h3>
    <div class="prog" style="--c:var(--accent)"><div class="track"><div class="fill" style="width:${pct}%"></div></div><span>${met} of ${need.size} at the required rung</span></div>
    <p class="none" style="margin-top:6px">Required rungs come from the map: the role's core topics at ${role.depth==="s"?"Skill":"Knowledge"}, their direct prerequisites at ${role.depth==="s"?"Knowledge":"Information"}, and everything further back at Information. Mark your rungs in any topic to update this.</p>
    <h3>Your starting point</h3>
    <select class="bgsel" data-bg aria-label="Your background">${BACKGROUNDS.map(b=>`<option value="${b.id}" ${b.id===getBg()?"selected":""}>${esc(b.name)}</option>`).join("")}</select>
    <h3>Learning path: ${(PHASES[role.id]||[]).length} phases</h3>
    <ol class="phases">${phaseStatus(role).map(({ph,ids,st,known},i)=>`<li class="phase ${st}">
      <div class="phhead"><span class="phn">${i+1}</span><b>${esc(ph[0])}</b><span class="phst">${st==="done"?"Covered":(st==="now"?"Start here · ":"")+`${ids.length-known.size} new`}</span></div>
      ${st==="done"?`<p class="none">Covered by your background or your marked rungs.</p>`:`
      <div class="links">${ids.map(id=>known.has(id)?itemHTML(byId.get(id)).replace('class="item"','class="item known" title="Already covered"'):itemHTML(byId.get(id))).join("")}</div>
      <dl class="phk">
        <div><dt><span class="rk2 r-k">K</span>Teach-back</dt><dd>${esc(ph[2])}</dd></div>
        <div><dt><span class="rk2 r-s">S</span>Capstone</dt><dd>${esc(ph[3])}</dd></div>
        ${ph[4]?`<div><dt><span class="rk2 r-x">S</span>Milestone</dt><dd>${esc(ph[4])}</dd></div>`:""}
      </dl>`}
    </li>`).join("")}</ol>
    ${next.length?`<h3>Close these gaps next</h3><div class="links">${next.map(n=>`<button class="item" data-id="${n.id}" style="--c:var(--d-${n.d})"><span class="dot"></span>${esc(n.label)}<span class="need">needs ${STAGE_LETTER[need.get(n)]}</span></button>`).join("")}</div>`:`<p class="none">You meet every required rung for this role.</p>`}
    <h3>Full topic set by rung</h3>
    ${group(RUNG_LABEL[role.depth], role.depth==="s"?S:K, false)}
    ${role.depth==="s"?group(RUNG_LABEL.k, K, false):""}
    ${group(RUNG_LABEL.i, I, false)}
    <p class="foot">Click empty map space to leave this role. Link to this role: #role-${role.id}</p>`;
}
let roleDetail = null;
function renderRoles(){
  const el=document.getElementById("roles");
  if(isPhone() && roleDetail){ const role=ROLES.find(x=>x.id===roleDetail);
    el.innerHTML = `<div class="roleback"><button class="btn" data-roleback>‹ All roles</button><button class="btn primary" data-rolemap="${role.id}">Show on map</button></div><div class="rdetail">${roleHTML(role)}</div>`; return; }
  el.innerHTML = `<div class="rolesintro"><h2>Learning paths by role</h2><p>Each role has an ordered path of phases. Every phase lists topics to study, a teach-back to prove Knowledge, a capstone to prove Skill and a milestone for Success. Pick your background to skip what you already know.</p>
    <label class="bglabel">Your background <select class="bgsel" data-bg aria-label="Your background">${BACKGROUNDS.map(b=>`<option value="${b.id}" ${b.id===getBg()?"selected":""}>${esc(b.name)}</option>`).join("")}</select></label></div>` +
    Object.entries(ROLE_FAMILIES).map(([f,fname])=>`<section class="rfam"><h3>${esc(fname)}</h3><div class="rcards">${ROLES.filter(r=>r.fam===f).map(r=>{
      const need=rolePath(r), {met}=roleGap(need), core=[...need.values()].filter(x=>x===r.depth).length;
      return `<button class="rcard${state.role===r.id?" cur":""}" data-role="${r.id}">
        <b>${esc(r.name)}</b><span class="rd">${esc(r.does)}</span>
        <span class="rm">${(()=>{ const ps=phaseStatus(r), tot=ps.reduce((a,x)=>a+x.ids.length,0), kn=ps.reduce((a,x)=>a+x.known.size,0), at=ps.findIndex(x=>x.st==="now")+1; return `${ps.length} phases · ${at?`start at phase ${at}`:"all covered"} · ${tot-kn} of ${tot} topics new to you`; })()}</span>
        <span class="rm">Success: ${r.success.map(k=>esc(FORM[k].name)).join(" · ")}</span>
        <span class="rbar"><span style="width:${Math.round(met/need.size*100)}%"></span></span>
      </button>`; }).join("")}</div></section>`).join("");
}
document.getElementById("roles").addEventListener("change", ev=>{ if(ev.target.matches("[data-bg]")){ setBg(ev.target.value); renderRoles(); if(state.role) renderPanel(); } });
document.getElementById("roles").addEventListener("click", ev=>{
  if(ev.target.closest("[data-roleback]")){ roleDetail=null; renderRoles(); document.getElementById("roles").scrollTop=0; return; }
  const m=ev.target.closest("[data-rolemap]"); if(m){ setView("graph"); selectRole(m.dataset.rolemap); return; }
  const it=ev.target.closest("[data-id]"); if(it){ openModal(it.dataset.id); return; }
  const c=ev.target.closest("[data-role]"); if(!c) return;
  if(isPhone()){ roleDetail=c.dataset.role; selectRole(c.dataset.role); renderRoles(); document.getElementById("roles").scrollTop=0; return; }
  setView("graph"); selectRole(c.dataset.role);
});

document.getElementById("pttl").innerHTML = KISS_TITLE;

/* ---------- Android bridge ---------- */
function shareTopic(id){
  const n=byId.get(id); if(!n||!window.AtlasNative) return;
  const r=resourcesFor(n); const subs=(SYL[id]||"").split(";").map(x=>x.trim()).filter(Boolean);
  const k=kissFor(n);
  const text=[`${n.label} (Level ${n.lv}, ${dName[n.d]})`,n.desc,"",
    "K.I.S.S. ladder:",...KISS_STAGES.map((st,i)=>`${st.name}: ${k[i]}`),"",
    "Topics to cover:",...subs.map((x,i)=>`${i+1}. ${x}`),"",
    "Resources:",...[...r.learn,...r.papers].map(x=>`• ${x.t}: ${x.u}`)].join("\n");
  window.AtlasNative.share(n.label, text);
}
/* ---------- Boot ---------- */
function start(){
  renderGraph(); renderList(); refreshStages();
  const h = location.hash.slice(1); const first = byId.has(h)? h : null;
  const firstRole = h.startsWith("role-") && ROLES.some(r=>r.id===h.slice(5)) ? h.slice(5) : null;
  let v=null; try{ v = localStorage.getItem("atlas-view"); }catch(e){}
  if(!["home","graph","list","roles"].includes(v)) v = isPhone() ? "home" : "graph";
  const r=svg.node().getBoundingClientRect(); svg.call(zoom.transform, d3.zoomIdentity.translate(r.width/2,r.height/2).scale(.7));
  setView(first||firstRole ? "graph" : v);
  if(first) select(first,{anim:false}); else if(firstRole){ selectRole(firstRole,{anim:false}); }
  else { renderPanel(); applyHighlight(); if(state.view==="graph"){ if(isPhone()) jumpLevel(0,false); else fit(false); } }
  if(isPhone() && state.view!=="graph"){ document.getElementById("map").style.display="block"; jumpLevel(0,false); document.getElementById("map").style.display="none"; }
}
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(start, start);
